name: Mise à jour station Efento (Causse de Montbel)

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les mesures Efento
        env:
          EFENTO_TOKEN: ${{ secrets.EFENTO_TOKEN }}
          EFENTO_STATION_NAME: Causse de Montbel
          # Optionnel : renseigner l'ID du point de mesure (visible dans les
          # logs au premier passage) pour éviter la recherche par nom.
          # EFENTO_MEASUREMENT_POINT_ID: "123456"
        run: python scripts/update_efento.py

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/efento.json
          git diff --cached --quiet || git commit -m "Mise à jour station Efento [skip ci]"
          git pull --rebase
          git push
