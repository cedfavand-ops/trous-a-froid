name: Mise à jour des prévisions (stations Datacake, cloud)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les prévisions (stations Datacake uniquement)
        env:
          STATIONS_SOURCE_FILTER: datacake

          DATACAKE_TOKEN_GREOLIERES: ${{ secrets.DATACAKE_TOKEN_GREOLIERES }}
          DATACAKE_DEVICE_ID_GREOLIERES: ${{ secrets.DATACAKE_DEVICE_ID_GREOLIERES }}
          DATACAKE_TEMP_FIELD_GREOLIERES: ${{ secrets.DATACAKE_TEMP_FIELD_GREOLIERES }}

          DATACAKE_TOKEN_CHAUD_CLAPIER: ${{ secrets.DATACAKE_TOKEN_CHAUD_CLAPIER }}
          DATACAKE_DEVICE_ID_CHAUD_CLAPIER: ${{ secrets.DATACAKE_DEVICE_ID_CHAUD_CLAPIER }}
          DATACAKE_TEMP_FIELD_CHAUD_CLAPIER: ${{ secrets.DATACAKE_TEMP_FIELD_CHAUD_CLAPIER }}

          DATACAKE_TOKEN_LA_PESSE: ${{ secrets.DATACAKE_TOKEN_LA_PESSE }}
          DATACAKE_DEVICE_ID_LA_PESSE: ${{ secrets.DATACAKE_DEVICE_ID_LA_PESSE }}
          DATACAKE_TEMP_FIELD_LA_PESSE: ${{ secrets.DATACAKE_TEMP_FIELD_LA_PESSE }}

          DATACAKE_TOKEN_TIGNES: ${{ secrets.DATACAKE_TOKEN_TIGNES }}
          DATACAKE_DEVICE_ID_TIGNES: ${{ secrets.DATACAKE_DEVICE_ID_TIGNES }}
          DATACAKE_TEMP_FIELD_TIGNES: ${{ secrets.DATACAKE_TEMP_FIELD_TIGNES }}

          DATACAKE_TOKEN_BEUIL: ${{ secrets.DATACAKE_TOKEN_BEUIL }}
          DATACAKE_DEVICE_ID_BEUIL: ${{ secrets.DATACAKE_DEVICE_ID_BEUIL }}
          DATACAKE_TEMP_FIELD_BEUIL: ${{ secrets.DATACAKE_TEMP_FIELD_BEUIL }}

          # Ajouter ici les secrets des prochaines stations Datacake au même
          # format, + une entrée dans STATIONS (scripts/update_forecast.py et
          # index.html).
        run: python scripts/update_forecast.py

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Mise à jour prévisions (Datacake) [skip ci]"
          git push
